name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 1. 彻底清理旧配置，防止默认的 SSD1306 驱动混进来
          rm -f sdkconfig
          
          # 2. 强制选中 Otto 机器人板型（这是核心！）
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          
          # 3. 强制开启 WebSocket 功能（之前报错的原因）
          echo "CONFIG_HTTPD_WS_SUPPORT=y" >> sdkconfig.defaults
          
          # 4. 设置目标芯片
          idf.py set-target esp32s3
          
          # 5. 编译并打包
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
