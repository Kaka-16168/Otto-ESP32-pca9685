name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 指定官方正式发布的 v6.0.1 镜像标签
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 【核心修改 1】：强制写入 otto-robot 板型配置到 defaults
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          
          # 【核心修改 2】：删除可能存在的旧 sdkconfig，确保上面的配置强制生效
          rm -f sdkconfig
          
          # 设置目标芯片
          idf.py set-target esp32s3
          
          # 编译并打包
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
