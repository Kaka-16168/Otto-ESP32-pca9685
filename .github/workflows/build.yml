name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 指定官方正式发布的 v6.0.1 镜像标签
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 1. 清除旧配置，确保接下来写入的是全新配置
          rm -f sdkconfig
          
          # 2. 注入 Otto 机器人和 WebSocket 支持配置
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          echo "CONFIG_HTTPD_WS_SUPPORT=y" >> sdkconfig.defaults
          
          # 3. 设置目标芯片（这一步会读取上面的 defaults 生成正确的 sdkconfig）
          idf.py set-target esp32s3
          
          # 4. 编译并打包
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
