jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.2" # 建议指定版本，比 latest 更稳定
      - name: Build
        run: |
          cd xiaozhi-esp32
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin
