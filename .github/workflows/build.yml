name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          # 1. 清理可能残留的旧配置
          rm -f sdkconfig
          
          # 2. 注入核心配置（强制开启 Otto 板型、开启 WebSocket、开启 N16R8 的 PSRAM）
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          echo "CONFIG_HTTPD_WS_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          
          # 3. 设置目标芯片并编译
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
