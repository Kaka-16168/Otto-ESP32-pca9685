name: Build ESP32-S3 Firmware (Otto Robot)

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          
          idf.py set-target esp32s3
          
          # 核心修改：强制把默认板型替换为 OTTO_ROBOT
          # 如果你的 sdkconfig.defaults 里有默认板型，这行会替换它；如果没有，它会添加进去
          sed -i 's/CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y/CONFIG_BOARD_TYPE_OTTO_ROBOT=y/g' sdkconfig.defaults || true
          echo "CONFIG_BOARD_TYPE_OTTO_ROBOT=y" >> sdkconfig.defaults
          
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-otto-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
