name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 指定官方正式发布的 v6.0.1 镜像标签，满足代码的版本要求
    container: espressif/idf:v6.0.1 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          cd xiaozhi-esp32
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
