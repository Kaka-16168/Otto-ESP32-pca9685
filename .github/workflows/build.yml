name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Firmware
        run: |
          # 关键修复：加载 ESP-IDF 环境，让系统能找到 idf.py
          . $IDF_PATH/export.sh
          
          # 进入项目目录（根据你的截图，代码在这个文件夹里）
          cd xiaozhi-esp32
          
          # 设置目标芯片为 ESP32-S3
          idf.py set-target esp32s3
          
          # 开始编译
          idf.py build
          
          # 打包合并成一个单一的固件（方便烧录，只需写入0x0地址）
          idf.py merge-bin
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: xiaozhi-esp32/build/merged-binary.bin
