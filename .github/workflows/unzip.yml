name: Auto Unzip

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限，必须要有，否则无法提交解压后的文件
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip files
        run: |
          # 这里已经精准匹配你截图里的压缩包名字
          unzip xiaozhi-esp32.zip -d .
          rm xiaozhi-esp32.zip

      - name: Commit unzipped files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzipped files from zip"
          git push
